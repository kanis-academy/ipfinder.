
name: Build IPFinder Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract IPFinder ZIP
        shell: bash
        run: |
          ZIP=$(find . -type f -iname "IPFinder-Android-corrige.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : IPFinder-Android-corrige.zip introuvable"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "ZIP extrait avec succès"

      - name: Find Android Project
        id: android
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR=$(dirname "$file")

            if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : Projet Android introuvable dans le ZIP"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.android.outputs.project_dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Gradle wrapper introuvable"
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find extracted -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK introuvable"
            exit 1
          fi

          cp "$APK" IPFinder-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IPFinder-Debug-APK
          path: IPFinder-debug.apk
          

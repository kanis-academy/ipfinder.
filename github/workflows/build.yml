
name: Build IP Finder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP file not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extraction completed."
          find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f | head -200

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug --no-daemon --stacktrace --console=plain
          else
            echo "ERROR: Gradle wrapper and Gradle installation not found."
            exit 1
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not found after build."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/IPFinder.apk"

          echo "APK successfully collected."
          ls -lh "$GITHUB_WORKSPACE/artifacts/IPFinder.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPFinder-APK
          path: artifacts/IPFinder.apk
          if-no-files-found: error
          retention-days: 14
          

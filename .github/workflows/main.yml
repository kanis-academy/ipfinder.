
name: Build IPFinder Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Find Android APK
        id: findapk
        shell: bash
        run: |
          echo "Recherche du fichier APK..."

          APK=$(find . -type f -name "*.apk" \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : Aucun APK trouvé."
            echo "Contenu des dossiers de compilation :"
            find . -type d -path "*/build/outputs/*"
            exit 1
          fi

          echo "APK trouvé : $APK"
          cp "$APK" IPFinder-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IPFinder-Debug-APK
          path: IPFinder-debug.apk
          if-no-files-found: error
          


name: Build IPFinder Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: android
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            dir=$(dirname "$file")
            if [ -f "$dir/app/build.gradle" ] || [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*')

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : Projet Android introuvable."
            echo "Vérifie la présence de settings.gradle et app/build.gradle."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: .
        run: |
          cd "${{ steps.android.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPFinder-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
